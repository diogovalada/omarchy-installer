[package]
name = "omarchy-setup-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Pure safety domain model for Omarchy Installer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
