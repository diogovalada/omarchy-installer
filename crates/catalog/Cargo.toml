[package]
name = "omarchy-setup-catalog"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Strict signed artifact catalog verification for Omarchy Setup"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
