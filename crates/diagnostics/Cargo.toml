[package]
name = "omarchy-diagnostics"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Local-only, privacy-preserving diagnostic bundles for Omarchy Installer"

[dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1.0"
