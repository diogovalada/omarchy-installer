[package]
name = "omarchy-provider-contract"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Versioned, data-only lifecycle contract for Omarchy Installer providers"

[dependencies]
schemars = { version = "1.0.4", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.11.0"
thiserror = "2.0.16"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.rust]
unsafe_code = "forbid"
