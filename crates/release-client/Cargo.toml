[package]
name = "omarchy-release-client"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "Official Omarchy release discovery and pinned-signature verified downloads"

[dependencies]
omarchy-downloader = { path = "../downloader" }
pgp = { version = "0.20.0", default-features = false }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "time", "macros", "net"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
tempfile = "3.20"
serde_json = "1.0"

[lints]
workspace = true
