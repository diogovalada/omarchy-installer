[package]
name = "omarchy-setup-ipc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strict, versioned IPC protocol types for Omarchy Setup"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
