[package]
name = "omarchy-journal"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Crash-aware, hash-chained operation journal for Omarchy Installer"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.0"
