[package]
name = "omarchy-portable-cache"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace]
