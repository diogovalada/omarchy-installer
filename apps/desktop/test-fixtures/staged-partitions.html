<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged installer partition preview</title></head>
<body><div id="app"></div><script type="module">
// In-memory desktop bridge: no host inspection or disk writes.
// Scenarios: ?limited ?oem ?free ?two-ntfs ?two-disks ?failed ?replace-only
// ?checking ?review (?review=stale: the disk changed after the check), or
// ?layout=<name> for test-fixtures/staged-layouts/<name>.json (a captured
// `stagedIso` value; see the README there). In Review, Cancel ends as the app
// reports a declined review, and Prepare installer shows copy progress.
// Each check replays the provider's timeline and progress messages: the
// layout first, then one partition measured at a time. A Recheck returns only
// at the end, as the real resize query does. Captured layouts are published as
// captured, in one step. window.__fixtureSettled is true once it ends.
import '/src/styles.css';
import { mount } from 'svelte';
import StagedInstaller from '/src/lib/StagedInstaller.svelte';
import { setup } from '/src/lib/setup';
const GiB=1024**3, MiB=1024**2, temporaryBytes=7.5*GiB, minimumLinuxBytes=32*GiB, stepMs=500;
const query=new URLSearchParams(location.search);
const scenario=['limited','oem','free','two-ntfs','two-disks','failed','replace-only','checking'].find(name=>query.has(name)) ?? 'ready';
const kept='System or unsupported partition; kept unchanged.';
const encryption=[{driveLetter:'C:',isOsVolume:true,conversionStatus:1,protectionStatus:1,lockStatus:0}];
const alignUp=bytes=>Math.ceil(bytes/MiB)*MiB;
// Get-ShrinkCandidate keeps max(20 GiB, 10% of the volume) free.
const reserve=sizeBytes=>alignUp(Math.max(20*GiB,sizeBytes/10));
let guid=0;
const partition=(label,sizeBytes,extra={})=>({kind:'partition',label,sizeBytes,fileSystem:'',freeBytes:null,resizeState:'unavailable',resizeReason:kept,maximumReleaseBytes:null,reserveBytes:null,isWindows:false,...extra});
const efi=(sizeBytes=260*MiB)=>partition('EFI system',sizeBytes);
const msr=()=>partition('Microsoft reserved',16*MiB);
const recovery=()=>partition('Windows recovery',GiB);
const free=sizeBytes=>({kind:'free',label:'Unallocated space',sizeBytes});
// NTFS starts as the provider's quick precheck leaves it; `measured` is the
// result of Windows' shrink check, which can't release into the reserve.
function ntfs(label,sizeBytes,freeBytes,measured,extra={}) {
  const reserveBytes=reserve(sizeBytes);
  if(measured?.maximumReleaseBytes>freeBytes-reserveBytes) throw new Error(`${label} releases more than the provider allows.`);
  const tooSmall=sizeBytes<temporaryBytes+reserveBytes;
  const precheck=freeBytes<temporaryBytes+reserveBytes
    ? {resizeState:'insufficient',reserveBytes,resizeReason:tooSmall ? 'This partition is too small for the temporary installer.' : 'Not enough space can be released while keeping the Windows free-space reserve. Free up space in Windows, then refresh.'}
    : {resizeState:'unchecked',resizeReason:''};
  return partition(label,sizeBytes,{fileSystem:'NTFS',freeBytes,...precheck,measured:measured && {reserveBytes,...measured},...extra});
}
const checked=maximumReleaseBytes=>({resizeState:'checked',resizeReason:'',maximumReleaseBytes});
// The provider has no reserve without a valid Windows limit, and reports 0.
const failed={resizeState:'failed',resizeReason:'Windows returned unsupported NTFS shrink limits.',maximumReleaseBytes:null,reserveBytes:0};
function layout(diskNumber,specs) {
  let offsetBytes=MiB, partitionNumber=0;
  const regions=specs.map(spec=>{
    const region={...spec,offsetBytes};
    offsetBytes+=spec.sizeBytes;
    return region.kind==='free' ? region : {...region,partitionNumber:++partitionNumber,partitionGuid:`fixture-guid-${++guid}`};
  });
  return {diskNumber,diskUniqueId:`fixture-disk-${diskNumber}`,diskSizeBytes:offsetBytes+MiB,regions};
}
const windows=(sizeBytes,freeBytes,measured)=>ntfs('C:',sizeBytes,freeBytes,measured,{isWindows:true});
const scenarios={
  ready:()=>[layout(0,[efi(),windows(953*GiB,200*GiB,checked(100*GiB)),recovery()])],
  limited:()=>[layout(0,[efi(),windows(953*GiB,200*GiB,checked(3*GiB)),recovery()])],
  oem:()=>[layout(0,[efi(100*MiB),msr(),free(MiB),windows(460*GiB,210*GiB,checked(150*GiB)),recovery(),ntfs('IMAGE (Partition 5)',14*GiB,1.2*GiB,null),partition('Partition 6',900*MiB)])],
  free:()=>[layout(0,[efi(),msr(),windows(700*GiB,150*GiB,checked(45*GiB)),free(120*GiB),recovery()])],
  'two-ntfs':()=>[layout(0,[efi(),msr(),windows(476*GiB,150*GiB,checked(80*GiB)),ntfs('Data (D:)',1386*GiB,900*GiB,checked(700*GiB)),recovery()])],
  'two-disks':()=>[layout(0,[efi(),windows(953*GiB,200*GiB,checked(100*GiB)),recovery()])],
  failed:()=>[layout(0,[efi(),windows(953*GiB,200*GiB,failed),recovery()])],
  'replace-only':()=>[layout(0,[efi(),windows(238*GiB,60*GiB,checked(30*GiB)),recovery()])],
  checking:()=>[layout(0,[efi(),windows(953*GiB,200*GiB,checked(100*GiB)),recovery()])]
};
const blocked=scenario==='two-disks'?[{diskNumber:1,diskUniqueId:'fixture-disk-1',diskSizeBytes:2000*1000**3,reason:'This disk uses the older MBR layout (legacy BIOS). Installing without USB needs a GPT disk; use a USB installer instead.',encryption:[]}]:[];
const disks=scenarios[scenario]();
const initial=structuredClone(disks);
const regions=(view=disks)=>view.flatMap(disk=>disk.regions.map(region=>({disk,region})));
// Same rules as Get-StagingChoices: free space that fits the installer, then
// measured shrinks that release it (appended after free space, as the provider merges them).
function choices(view) {
  const choice=(disk,target,label)=>{
    const remaining=disk.regions.filter(r=>r.kind==='free').map(r=>r.sizeBytes-(target.start_offset_bytes===r.offsetBytes?temporaryBytes:0));
    return {diskNumber:disk.diskNumber,diskUniqueId:disk.diskUniqueId,label,target,diskSizeBytes:disk.diskSizeBytes,encryption,largestFreeAfterStagingBytes:Math.max(0,...remaining)};
  };
  return [
    ...regions(view).filter(({region})=>region.kind==='free' && region.sizeBytes>=temporaryBytes)
      .map(({disk,region})=>choice(disk,{target_kind:'free',start_offset_bytes:region.offsetBytes},`Unallocated space (${Math.round(region.sizeBytes/GiB*10)/10} GiB)`)),
    ...regions(view).filter(({region})=>region.resizeState==='checked' && region.maximumReleaseBytes>=temporaryBytes)
      .map(({disk,region})=>choice(disk,{target_kind:'shrink',partition_number:region.partitionNumber,partition_guid:region.partitionGuid},`Resize ${region.label}`))
  ];
}
function inventory(view=disks) {
  const listed=view.map(({regions,...disk})=>{
    const shown=regions.map(({measured,...region})=>region);
    const unallocated=shown.filter(r=>r.kind==='free').map(r=>r.sizeBytes);
    return {...disk,regions:shown,unallocatedBytes:unallocated.reduce((a,b)=>a+b,0),largestFreeBytes:Math.max(0,...unallocated),encryption,layoutSha256:`fixture-layout-${disk.diskNumber}`};
  });
  return {choices:choices(view),blocked,disks:listed,minimumLinuxBytes,temporaryBytes,secureBoot:true};
}
// A reviewed plan for keeping Windows with 64 GiB for Omarchy, placed as
// Get-StagingPlan does, on the disk shown (the captured one with ?layout).
function reviewFor() {
  const source=capturedLayout ?? inventory(), disk=source.disks[0], c=disk.regions.find(r=>r.isWindows && r.resizeState==='checked');
  const temporary=source.temporaryBytes, minimum=source.minimumLinuxBytes;
  if(!c || c.maximumReleaseBytes<temporary+64*GiB) return null;
  const start=Math.floor((c.offsetBytes+c.sizeBytes)/MiB)*MiB-temporary-64*GiB, size=bytes=>(bytes/GiB).toFixed(1);
  // Volumes with protection on, as the helper's summary filters them.
  const bitLocker=(disk.encryption ?? []).filter(v=>v.protectionStatus===1).map(v=>v.driveLetter || 'a volume without a drive letter');
  // Omarchy's space joins free space right after C:, and a larger free
  // region elsewhere can remain; the provider reports the largest.
  const index=disk.regions.indexOf(c), next=disk.regions[index+1];
  // The helper names a partition by drive letter, as the plan's review rules say.
  const name=c.label.match(/([A-Z]:)\)?$/)?.[1] ?? `Partition ${c.partitionNumber}`;
  const largest=Math.max(64*GiB+(next?.kind==='free' ? next.sizeBytes : 0),...disk.regions.filter((r,i)=>r.kind==='free' && i!==index+1).map(r=>r.sizeBytes));
  const review={diskNumber:disk.diskNumber,diskSizeBytes:disk.diskSizeBytes,layoutSha256:query.get('review')==='stale' ? 'changed' : disk.layoutSha256,targetKind:'shrink',
    shrink:{label:name,partitionGuid:c.partitionGuid,offsetBytes:c.offsetBytes,beforeSizeBytes:c.sizeBytes,afterSizeBytes:start-c.offsetBytes},
    temporary:{offsetBytes:start,sizeBytes:temporary},omarchy:{offsetBytes:start+temporary,sizeBytes:64*GiB},
    largestFreeAfterBytes:largest,minimumOmarchyBytes:minimum,bitLocker,warning:'experimental'};
  const encryption=bitLocker.length ? `\n\nSuspend BitLocker protection on ${bitLocker.join(', ')} without decrypting. It stays suspended until you resume it; a reminder at Windows sign-in helps you do that after installing.` : '';
  const summary=`EXPERIMENTAL TESTING BUILD: real disk changes. This official ISO may fail to boot from staging or refuse same-disk installation.\n\nPrepare the installer on Disk ${disk.diskNumber}?\n\nShrink ${name} from ${size(c.sizeBytes)} to ${size(start-c.offsetBytes)} GiB. Leave 64 GiB unallocated for Omarchy after it. Create two temporary installer partitions. Windows Boot Manager and the boot order are kept. Afterwards, the largest free space is ${size(largest)} GiB.${encryption}\n\nThis does not install Omarchy yet. Next, select the installer for the next restart. Keep the temporary installer until Omarchy starts on its own.`;
  return {summary,review};
}
const captured=query.get('layout');
let capturedLayout=null;
if(captured) {
  const response=await fetch(`/test-fixtures/staged-layouts/${encodeURIComponent(captured)}.json`);
  if(!response.ok || !response.headers.get('content-type')?.includes('json')) throw new Error(`No captured layout named ${captured}.`);
  capturedLayout=await response.json();
}
const snapshot={status:'idle',stage:'',message:'',stagedTesting:true,stagedIso:null};
let timers=[];
const progress=(stage,message)=>Object.assign(snapshot,{stage,message});
const measuring=region=>`Checking how much ${region.label} can shrink. Windows may take several minutes; no partitions are being changed.`;
// The helper clears stagedIso and runs (Staging.ps1, Get-StagingInspection).
// A full check publishes the layout, then each measurement. A resize query
// publishes nothing until it returns: the queried partition measured, the
// others as the precheck left them, and only free-space and queried choices.
// The UI merges that into what it already shows.
function check(resize) {
  timers.forEach(clearTimeout); timers=[]; window.__fixtureSettled=false;
  Object.assign(snapshot,{status:'running',stagedIso:null,stagedReview:null});
  progress('loading','Loading Windows disk tools...');
  const steps=[];
  let result=()=>inventory();
  if(capturedLayout) {
    steps.push(()=>progress('inspecting','Reading disks and Windows encryption status...'));
    result=()=>structuredClone(capturedLayout);
  } else if(resize) {
    const view=disks.map((disk,index)=>({...disk,regions:structuredClone(initial[index].regions).map(r=>r.partitionGuid===resize.partitionGuid && r.measured ? {...r,...r.measured} : r)}));
    const region=view.flatMap(disk=>disk.regions).find(r=>r.partitionGuid===resize.partitionGuid);
    steps.push(()=>progress('analyzing-resize',measuring(region)));
    result=()=>inventory(view);
  } else {
    disks.forEach((disk,index)=>{disk.regions=structuredClone(initial[index].regions);});
    const targets=regions().filter(({region})=>region.resizeState==='unchecked' && region.measured);
    steps.push(()=>{progress('inspecting','Disks are ready. Checking Windows resize limits...');snapshot.stagedIso=inventory();});
    for(const [index,{disk,region}] of targets.entries()) {
      steps.push(()=>progress('analyzing-resize',measuring(region)));
      // ?checking stays on the first measurement.
      if(scenario==='checking' && index===0) break;
      steps.push(()=>{Object.assign(region,region.measured);progress('analyzing-resize',`Checked resize limit for ${region.label} on Disk ${disk.diskNumber}.`);snapshot.stagedIso=inventory();});
    }
  }
  if(scenario!=='checking') steps.push(()=>{
    Object.assign(snapshot,{status:'complete',stage:'complete',message:'Temporary installer updated.',stagedIso:result()});
    // The helper waits for the answer while a review is shown.
    if(query.has('review') && !resize) Object.assign(snapshot,{status:'running',stage:'staged-installer',stagedReview:reviewFor()});
  });
  steps.forEach((step,index)=>timers.push(setTimeout(async()=>{
    step(); await setup.refresh();
    if(index===steps.length-1) window.__fixtureSettled=true;
  },(index+1)*stepMs)));
}
window.isTauri=true;
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
  if(command==='setup_status')return structuredClone(snapshot);
  if(command==='staged_iso' && args.action==='inspect'){check(args.resize);return structuredClone(snapshot);}
  if(command==='respond_staged_review'){
    if(args.approved) Object.assign(snapshot,{stagedReview:null,stage:'copying-installer',message:'Copying and verifying the installer...',bytes:2*GiB,totalBytes:6*GiB,cancelAvailable:true,cancelRequested:false});
    else Object.assign(snapshot,{stagedReview:null,status:'cancelled',message:'Nothing was changed.'});
    return structuredClone(snapshot);
  }
  throw new Error('Preview only: this action is not implemented.');
}};
check(null);
await setup.refresh();
mount(StagedInstaller,{target:document.getElementById('app'),props:{sourceReady:true}});
</script><style>body{overflow:auto}#app{max-width:880px;padding:24px;margin:auto}</style></body></html>
