<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staged installer partition preview</title></head>
<body><div id="app"></div><script type="module">
// In-memory desktop bridge: no host inspection or disk writes.
import '/src/styles.css';
import { mount } from 'svelte';
import StagedInstaller from '/src/lib/StagedInstaller.svelte';
import { setup } from '/src/lib/setup';
const GiB=1024**3, MiB=1024**2;
const limited=new URLSearchParams(location.search).has('limited');
const partition={kind:'partition',partitionNumber:3,partitionGuid:'fixture-guid',offsetBytes:300*MiB,sizeBytes:953*GiB,label:'C:',fileSystem:'NTFS',freeBytes:180*GiB,resizeState:'unchecked'};
const disk={diskNumber:0,diskUniqueId:'fixture-disk',diskSizeBytes:954*GiB,unallocatedBytes:0,largestFreeBytes:0,regions:[{kind:'partition',partitionNumber:1,offsetBytes:MiB,sizeBytes:260*MiB,label:'EFI system',resizeState:'unavailable',resizeReason:'System partition; kept unchanged.'},partition,{kind:'partition',partitionNumber:4,offsetBytes:954*GiB-GiB,sizeBytes:GiB,label:'Windows recovery',resizeState:'unavailable',resizeReason:'System partition; kept unchanged.'}]};
const snapshot={status:'running',stage:'inspecting',stagedTesting:true,stagedIso:{choices:[],blocked:[],disks:[disk],minimumLinuxBytes:32*GiB,temporaryBytes:7.5*GiB}};
window.isTauri=true;
window.__TAURI_INTERNALS__={invoke:async(command,args)=>{
  if(command==='setup_status')return structuredClone(snapshot);
  if(command==='staged_iso' && args.action==='inspect'){
    partition.resizeState=args.resize?'checked':'unchecked';
    partition.maximumReleaseBytes=args.resize?(limited?3:100)*GiB:null;
    partition.reserveBytes=args.resize?20*GiB:null;
    snapshot.stagedIso.choices=args.resize&&!limited?[{diskNumber:0,diskUniqueId:disk.diskUniqueId,diskSizeBytes:disk.diskSizeBytes,label:'Resize C:',largestFreeAfterStagingBytes:0,target:{target_kind:'shrink',partition_number:3,partition_guid:partition.partitionGuid},encryption:[{protectionStatus:1}]}]:[];
    return structuredClone(snapshot);
  }
  throw new Error('Preview only: this action is not implemented.');
}};
await setup.refresh();
mount(StagedInstaller,{target:document.getElementById('app'),props:{sourceReady:true}});
setTimeout(()=>{
  partition.resizeState='checked';partition.maximumReleaseBytes=(limited?3:100)*GiB;partition.reserveBytes=20*GiB;
  snapshot.stagedIso.choices=limited?[]:[{diskNumber:0,diskUniqueId:disk.diskUniqueId,diskSizeBytes:disk.diskSizeBytes,label:'Resize C:',largestFreeAfterStagingBytes:0,target:{target_kind:'shrink',partition_number:3,partition_guid:partition.partitionGuid},encryption:[{protectionStatus:1}]}];
  snapshot.stage='analyzing-resize';void setup.refresh();
},1000);
setTimeout(()=>{snapshot.status='complete';snapshot.stage='complete';void setup.refresh();},2000);
</script><style>body{overflow:auto}#app{max-width:880px;padding:24px;margin:auto}</style></body></html>
