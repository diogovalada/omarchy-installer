[package]
name = "omarchy-setup-desktop"
version = "0.1.0-preview.2"
description = "Omarchy Installer community preview desktop shell"
authors = ["Omarchy Installer contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.93"

[lib]
name = "omarchy_setup_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
omarchy-release-client = { path = "../../../crates/release-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pgp]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# Keep the desktop shell independent of the safety-critical root workspace.
[workspace]
