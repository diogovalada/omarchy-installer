[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Reviewed public-key-only integration; revisit before adding private-key use.
# Scope and evidence: docs/evidence/dependency-policy-2026-09-13.md.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "pgp is used only to verify downloaded signatures with public keys. No production RSA signing or private-key decryption. See the dependency-policy review." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    { name = "webpki-roots", version = "=1.0.9", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
