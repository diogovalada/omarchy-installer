name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: Changes and release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.changes.outputs.code_changed }}
    steps:
      - name: Check out repository and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Detect documentation-only changes
        id: changes
        run: node scripts/ci-changes.mjs
      - name: Verify release metadata and CI helpers
        run: |
          node scripts/release-version.mjs --check
          node --test scripts/ci-changes.test.mjs scripts/release-version.test.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

  frontend:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable the repository-pinned pnpm version
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check desktop app
        run: pnpm --filter ./apps/desktop run check

      - name: Verify pinned visual assets offline
        run: pnpm assets:check

      - name: Test desktop app
        run: pnpm --filter ./apps/desktop run test

      - name: Build desktop app
        run: pnpm --filter ./apps/desktop run build

  native-download-and-media:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Native download and file-backed USB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pinned Etcher node-gyp dependencies require Visual Studio 2022.
        os: [windows-2022, ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable the repository-pinned pnpm version
        run: corepack enable
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm desktop:build
      - name: Install pinned Etcher adapter dependencies
        run: npm --prefix providers/media-etcher ci --no-audit --no-fund
      - name: Test file-backed Etcher writes
        run: pnpm media:test
      - name: Check native dependency loading
        run: pnpm media:probe
      - name: Check native POSIX discovery without writing media
        working-directory: providers/media-etcher
        run: node scripts/check-host-discovery.cjs
      - name: Check packaged writer and isolated inspector
        working-directory: providers/media-etcher
        run: node scripts/check-staged-physical-runtime.cjs
      - name: Stage authenticated native providers for desktop tests
        run: pnpm providers:stage
      - name: Check native formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Test native download state and export
        run: pnpm desktop:test:native
      - name: Test Windows disk inspection and portable verification
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./testkit/windows-direct/Test-StoragePlan.ps1
          & ./testkit/windows-direct/Test-RuntimeDistribution.ps1
          cargo test --manifest-path scripts/portable-cache-helper/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Portable verifier tests failed.' }

  dependency-policy:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.93.0"
          command: check
          arguments: --all-features

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  result:
    name: CI result
    if: always()
    needs: [changes, rust, frontend, native-download-and-media, dependency-policy, spelling]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful checks or intentional skips
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          node - <<'NODE'
          const checks = JSON.parse(process.env.CHECK_RESULTS);
          const full = checks.changes.outputs.code_changed === 'true';
          for (const [name, check] of Object.entries(checks)) {
            const required = full || ['changes', 'spelling'].includes(name);
            if (check.result !== 'success' && (required || check.result !== 'skipped')) {
              throw new Error(`${name}: ${check.result}`);
            }
          }
          console.log(full ? 'Full CI passed.' : 'Documentation checks passed; heavy jobs intentionally skipped.');
          NODE
